<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none">
  <defs>
    <!-- Violet Électrique Gradient (#7C3AED -> #6366F1) -->
    <linearGradient id="pulseVioletGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="45%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Corail Pop Gradient (#FF4D6D) -->
    <linearGradient id="pulseCoralGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FF6B8B" />
      <stop offset="50%" stop-color="#FF4D6D" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Jaune Étincelle Gradient (#FACC15) -->
    <linearGradient id="pulseSparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>

    <!-- Douce ombre portée ergonomique -->
    <filter id="pulseGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#7C3AED" flood-opacity="0.30" />
    </filter>
  </defs>

  <!-- 3 Rayons Étincelle Jaune (Top Right) -->
  <g stroke="url(#pulseSparkGrad)" stroke-width="5" stroke-linecap="round">
    <line x1="98" y1="26" x2="110" y2="16" />
    <line x1="86" y1="22" x2="91" y2="12" />
    <line x1="106" y1="38" x2="116" y2="35" />
  </g>

  <!-- Bulle / Corps principal "P" Violet Électrique -->
  <path
    d="M 66 22
       C 92 22, 110 40, 110 64
       C 110 88, 92 104, 68 104
       C 59 104, 51 101, 44 97
       C 37 104, 29 112, 25 115
       C 23.5 116.5, 22 115.5, 22.5 113.5
       C 24 107, 26 96, 26.5 90
       C 21 82.5, 18 73.5, 18 64
       C 18 40, 40 22, 66 22 Z"
    fill="url(#pulseVioletGrad)"
    filter="url(#pulseGlow)"
  />

  <!-- Détail tige Corail Pop sur la queue de la bulle -->
  <path
    d="M 26.5 90
       C 26 96, 24 107, 22.5 113.5
       C 22.2 114.5, 23 115.2, 23.8 114.3
       C 27.5 110.5, 36.5 101, 42.5 95
       C 38 91, 33 86.5, 29.5 81
       C 28 84, 27 87, 26.5 90 Z"
    fill="url(#pulseCoralGrad)"
  />

  <!-- Boucle interne "P" Corail Pop -->
  <circle cx="68" cy="62" r="27" fill="url(#pulseCoralGrad)" />

  <!-- Onde de Pouls / Rythme ECG (Blanc Pur) -->
  <path
    d="M 43 62
       L 53 62
       L 57 53
       L 62 73
       L 68 45
       L 74 71
       L 78 62
       L 93 62"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>